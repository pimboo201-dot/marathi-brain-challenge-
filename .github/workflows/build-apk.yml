name: Build Marathi Brain Challenge APK V17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          test -d player || { echo "player/ folder not found at repo root"; exit 1; }
          test -d assets || { echo "assets/ folder not found at repo root"; exit 1; }

      - name: Prepare web + Capacitor project
        run: |
          mkdir -p www
          cp -r player/* www/
          echo  | base64 -d > package.json
          echo  | base64 -d > capacitor.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android
        run: npx cap add android

      - name: Generate Android assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#1D2942' --iconBackgroundColorDark '#152238' --splashBackgroundColor '#F4F6F9' --splashBackgroundColorDark '#1D2942'

      - name: Configure Android SDK versions and AdMob ID
        run: |
          echo  | base64 -d > /tmp/configure_sdk.py
          python3 /tmp/configure_sdk.py

      - name: Write MainActivity.java
        run: |
          mkdir -p android/app/src/main/java/com/marathibrainchallenge/app
          echo  | base64 -d > android/app/src/main/java/com/marathibrainchallenge/app/MainActivity.java

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build V17 APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Marathi-Brain-Challenge-APK-V17
          path: android/app/build/outputs/apk/debug/app-debug.apk
