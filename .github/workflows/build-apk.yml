name: Build Marathi Brain Challenge APK V17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # Normal layout: player/ and assets/ are at repository root.
          if [ -d "player" ]; then
            PROJECT_ROOT="."
          else
            # Support a repository where the project was committed inside one
            # or more wrapper folders.
            PLAYER_DIR="$(find . -maxdepth 6 -type d -name player -print -quit || true)"
            if [ -n "$PLAYER_DIR" ]; then
              PROJECT_ROOT="${PLAYER_DIR%/player}"
            fi
          fi

          # Also support the common mistake of committing the project ZIP itself
          # instead of extracting its contents into the repository.
          if [ -z "$PROJECT_ROOT" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit || true)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p .build-source
              unzip -q "$ZIP_FILE" -d .build-source
              PLAYER_DIR="$(find .build-source -maxdepth 8 -type d -name player -print -quit || true)"
              if [ -n "$PLAYER_DIR" ]; then
                PROJECT_ROOT="${PLAYER_DIR%/player}"
              fi
            fi
          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -d "$PROJECT_ROOT/player" ]; then
            echo "ERROR: Could not find a project root containing player/."
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print | sort | head -200
            exit 1
          fi

          # The project needs the assets directory too. If it is missing, keep
          # the error explicit instead of failing later in the build.
          if [ ! -d "$PROJECT_ROOT/assets" ]; then
            echo "ERROR: assets/ folder not found under: $PROJECT_ROOT"
            exit 1
          fi

          # Normalize './' for later GitHub Actions working-directory usage.
          if [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT="$PWD"
          else
            PROJECT_ROOT="$PWD/${PROJECT_ROOT#./}"
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Using project root: $PROJECT_ROOT"
          echo "Contents:"
          find "$PROJECT_ROOT" -maxdepth 2 -type f -print | sort | head -200

      - name: Prepare web + Capacitor project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp -R player/. www/

          cat > package.json <<'JSON'
          {
            "name": "marathi-brain-challenge-v17",
            "version": "17.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/app": "^8.0.0",
              "@capacitor/core": "^8.0.0",
              "@capacitor/status-bar": "^8.0.0",
              "@capacitor-community/admob": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^8.0.0",
              "typescript": "^5.0.0"
            }
          }
          JSON

          cat > capacitor.config.ts <<'TS'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.marathibrainchallenge.app',
            appName: 'मराठी बुद्धीचाचणी',
            webDir: 'www'
          };

          export default config;
          TS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_ROOT }}/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --no-audit --no-fund

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx cap add android

      - name: Generate Android assets
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#1D2942' --iconBackgroundColorDark '#152238' --splashBackgroundColor '#F4F6F9' --splashBackgroundColorDark '#1D2942'

      - name: Configure Android SDK versions and AdMob ID
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('android/variables.gradle'),
              Path('android/app/build.gradle'),
              Path('android/app/build.gradle.kts'),
          ]

          replacements = [
              (r'(minSdkVersion\s*[=:]\s*)\d+', r'\g<1>24'),
              (r'(targetSdkVersion\s*[=:]\s*)\d+', r'\g<1>36'),
              (r'(compileSdkVersion\s*[=:]\s*)\d+', r'\g<1>36'),
              (r'(minSdk\s*[=:]\s*)\d+', r'\g<1>24'),
              (r'(targetSdk\s*[=:]\s*)\d+', r'\g<1>36'),
              (r'(compileSdk\s*[=:]\s*)\d+', r'\g<1>36'),
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for pattern, repl in replacements:
                  text = re.sub(pattern, repl, text)
              path.write_text(text, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          strings.parent.mkdir(parents=True, exist_ok=True)
          text = strings.read_text(encoding='utf-8') if strings.exists() else '<resources>\n</resources>\n'
          admob_line = '<string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>'
          if 'name="admob_app_id"' in text:
              text = re.sub(r'<string name="admob_app_id">.*?</string>', admob_line, text)
          else:
              text = text.replace('</resources>', f'    {admob_line}\n</resources>')
          strings.write_text(text, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in m:
              m = m.replace('</application>', f'    {meta}\n    </application>')
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Write MainActivity.java
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/marathibrainchallenge/app
          cat > android/app/src/main/java/com/marathibrainchallenge/app/MainActivity.java <<'JAVA'
          package com.marathibrainchallenge.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(android.graphics.Color.WHITE);
              getWindow().setNavigationBarColor(android.graphics.Color.WHITE);
              WebView webView = getBridge().getWebView();
              ViewCompat.setOnApplyWindowInsetsListener(webView, (view, insets) -> {
                Insets bars = insets.getInsets(
                    WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                float density = getResources().getDisplayMetrics().density;
                String js = "document.documentElement.style.setProperty('--safe-top','" + Math.round(bars.top / density) + "px');"
                    + "document.documentElement.style.setProperty('--safe-bottom','" + Math.round(bars.bottom / density) + "px');"
                    + "document.documentElement.style.setProperty('--safe-left','" + Math.round(bars.left / density) + "px');"
                    + "document.documentElement.style.setProperty('--safe-right','" + Math.round(bars.right / density) + "px');";
                webView.evaluateJavascript(js, null);
                return insets;
              });
              ViewCompat.requestApplyInsets(webView);
            }
          }
          JAVA

      - name: Sync Capacitor plugins
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx cap sync android

      - name: Build V17 APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: ./gradlew assembleDebug

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Marathi-Brain-Challenge-APK-V17
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
