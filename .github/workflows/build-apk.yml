      - name: Configure Android SDK and native system bars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [
              Path('android/variables.gradle'),
              Path('android/app/build.gradle'),
              Path('android/app/build.gradle.kts')
          ]:
              if not p.exists():
                  continue

              s = p.read_text()

              for pat, repl in [
                  (r'(minSdkVersion\s*[=:]\s*)\d+', r'\g<1>24'),
                  (r'(targetSdkVersion\s*[=:]\s*)\d+', r'\g<1>36'),
                  (r'(compileSdkVersion\s*[=:]\s*)\d+', r'\g<1>36'),
                  (r'(minSdk\s*[=:]\s*)\d+', r'\g<1>24'),
                  (r'(targetSdk\s*[=:]\s*)\d+', r'\g<1>36'),
                  (r'(compileSdk\s*[=:]\s*)\d+', r'\g<1>36')
              ]:
                  s = re.sub(pat, repl, s)

              p.write_text(s)

          strings = Path('android/app/src/main/res/values/strings.xml')
          strings.parent.mkdir(parents=True, exist_ok=True)

          text = (
              strings.read_text()
              if strings.exists()
              else '<resources>\n</resources>\n'
          )

          if 'name="admob_app_id"' in text:
              text = re.sub(
                  r'<string name="admob_app_id">.*?</string>',
                  '<string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>',
                  text
              )
          else:
              text = text.replace(
                  '</resources>',
                  '  <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>'
              )

          strings.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()

          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'

          if 'com.google.android.gms.ads.APPLICATION_ID' not in m:
              m = m.replace(
                  '</application>',
                  f'    {meta}\n    </application>'
              )

          manifest.write_text(m)

          main = Path('android/app/src/main/java/com/marathibrainchallenge/app/MainActivity.java')
          main.parent.mkdir(parents=True, exist_ok=True)

          main.write_text(r'''package com.marathibrainchallenge.app;

import android.os.Bundle;
import android.webkit.WebView;
import androidx.core.graphics.Insets;
import androidx.core.view.ViewCompat;
import androidx.core.view.WindowCompat;
import androidx.core.view.WindowInsetsCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
  @Override public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);

    WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

    getWindow().setStatusBarColor(android.graphics.Color.WHITE);
    getWindow().setNavigationBarColor(android.graphics.Color.WHITE);

    WindowCompat.getInsetsController(
      getWindow(),
      getWindow().getDecorView()
    ).setAppearanceLightStatusBars(true);

    WindowCompat.getInsetsController(
      getWindow(),
      getWindow().getDecorView()
    ).setAppearanceLightNavigationBars(true);

    getWindow().setNavigationBarContrastEnforced(false);

    WebView webView = getBridge().getWebView();

    ViewCompat.setOnApplyWindowInsetsListener(
      webView,
      (view, insets) -> {
        Insets bars = insets.getInsets(
          WindowInsetsCompat.Type.systemBars()
          | WindowInsetsCompat.Type.displayCutout()
        );

        float d = getResources().getDisplayMetrics().density;

        String js =
          "document.documentElement.style.setProperty('--safe-top','"
          + Math.round(bars.top / d)
          + "px');"
          + "document.documentElement.style.setProperty('--safe-bottom','"
          + Math.round(bars.bottom / d)
          + "px');"
          + "document.documentElement.style.setProperty('--safe-left','"
          + Math.round(bars.left / d)
          + "px');"
          + "document.documentElement.style.setProperty('--safe-right','"
          + Math.round(bars.right / d)
          + "px');";

        webView.evaluateJavascript(js, null);

        return insets;
      }
    );

    ViewCompat.requestApplyInsets(webView);
  }
}
''')
          PY
