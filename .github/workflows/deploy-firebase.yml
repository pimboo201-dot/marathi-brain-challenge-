name: Deploy Firestore Rules (Spark Plan)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and Extract Firebase Project
        shell: bash
        run: |
          set -euo pipefail

          FIREBASE_ROOT=""

          # Case 1: firebase.json already in repository
          if [ -f "firebase.json" ]; then
            FIREBASE_ROOT="$PWD"
          fi

          # Case 2: Search and extract any ZIP
          if [ -z "$FIREBASE_ROOT" ]; then

            ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            rm -rf .firebase-source
            mkdir -p .firebase-source

            unzip -q "$ZIP_FILE" -d .firebase-source

            FIREBASE_JSON="$(find .firebase-source -type f -name firebase.json | head -n 1 || true)"

            if [ -z "$FIREBASE_JSON" ]; then
              echo "ERROR: firebase.json not found inside ZIP."
              echo "ZIP contents:"
              find .firebase-source -type f | sort | head -200
              exit 1
            fi

            FIREBASE_ROOT="$(dirname "$FIREBASE_JSON")"
          fi

          echo "FIREBASE_ROOT=$FIREBASE_ROOT" >> "$GITHUB_ENV"
          echo "Using Firebase root: $FIREBASE_ROOT"

      - name: Validate Firebase Files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$FIREBASE_ROOT/firebase.json"
          test -f "$FIREBASE_ROOT/firebase/firestore.rules"

          echo "Firebase files verified."

      - name: Create Service Account File
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

          PROJECT_ID=$(node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8"));
            process.stdout.write(x.project_id);
          ')

          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Configure Firebase
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Verify Firebase Access
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          firebase projects:list --non-interactive

      - name: Deploy Firestore Rules
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules \
            --non-interactive

      - name: Cleanup
        if: always()
        run: |
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
