name: Deploy Firebase Backend V17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Firebase project
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_ROOT=""

          if [ -f "firebase.json" ] && [ -f "firebase/functions/index.js" ]; then
            FIREBASE_ROOT="."
          else
            FOUND_JSON="$(find . -maxdepth 8 -type f -name firebase.json -print -quit || true)"
            if [ -n "$FOUND_JSON" ]; then
              CANDIDATE="$(dirname "$FOUND_JSON")"
              if [ -f "$CANDIDATE/firebase/functions/index.js" ]; then
                FIREBASE_ROOT="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$FIREBASE_ROOT" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit || true)"
            if [ -n "$ZIP_FILE" ]; then
              rm -rf .firebase-source
              mkdir -p .firebase-source
              unzip -q "$ZIP_FILE" -d .firebase-source
              FOUND_JSON="$(find .firebase-source -maxdepth 10 -type f -name firebase.json -print -quit || true)"
              if [ -n "$FOUND_JSON" ]; then
                CANDIDATE="$(dirname "$FOUND_JSON")"
                if [ -f "$CANDIDATE/firebase/functions/index.js" ]; then
                  FIREBASE_ROOT="$CANDIDATE"
                fi
              fi
            fi
          fi

          if [ -z "$FIREBASE_ROOT" ]; then
            echo "ERROR: Firebase project not found. Expected firebase.json and firebase/functions/index.js."
            find . -maxdepth 5 -type f -print | sort | head -300
            exit 1
          fi

          if [ "$FIREBASE_ROOT" = "." ]; then
            FIREBASE_ROOT="$PWD"
          elif [[ "$FIREBASE_ROOT" = ./* ]]; then
            FIREBASE_ROOT="$PWD/${FIREBASE_ROOT#./}"
          fi

          echo "FIREBASE_ROOT=$FIREBASE_ROOT" >> "$GITHUB_ENV"
          echo "Using Firebase root: $FIREBASE_ROOT"

      - name: Validate Firebase files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$FIREBASE_ROOT/firebase.json"
          test -f "$FIREBASE_ROOT/firebase/firestore.rules"
          test -f "$FIREBASE_ROOT/firebase/functions/package.json"
          test -f "$FIREBASE_ROOT/firebase/functions/index.js"

      - name: Create service-account file and determine project ID
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ERROR: Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

          PROJECT_ID="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); if(!x.project_id || !x.client_email || !x.private_key) throw new Error('Service account JSON must contain project_id, client_email and private_key'); process.stdout.write(x.project_id);")"

          if [[ ! "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "ERROR: Service account contains an invalid Firebase/Google project ID: $PROJECT_ID"
            echo "Use the real project ID, for example: marathi-brain-challenge"
            exit 1
          fi

          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Firebase project ID loaded from the service-account JSON."

      - name: Verify client and service-account project match
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$FIREBASE_ROOT/player/firebase-config.js"
          if [ -f "$CONFIG" ]; then
            CLIENT_ID="$(node -e 'const fs=require("fs"); const t=fs.readFileSync(process.argv[1],"utf8"); const m=t.match(/\bprojectId\s*:\s*["\\']([^"\\']+)["\\']/); process.stdout.write(m ? m[1] : "");' "$CONFIG")"
            if [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "$FIREBASE_PROJECT_ID" ]; then
              echo "ERROR: Firebase project mismatch."
              echo "Service-account project_id: $FIREBASE_PROJECT_ID"
              echo "Client firebase-config projectId: $CLIENT_ID"
              exit 1
            fi
          else
            echo "Warning: player/firebase-config.js not found; skipping client project ID comparison."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Install Cloud Functions dependencies
        working-directory: ${{ env.FIREBASE_ROOT }}/firebase/functions
        run: npm install --no-audit --no-fund

      - name: Configure Firebase project
        working-directory: ${{ env.FIREBASE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc
          echo "Firebase project configured: $FIREBASE_PROJECT_ID"

      - name: Check Firebase authentication
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: firebase projects:list --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null

      - name: Deploy Firestore rules and Cloud Functions
        working-directory: ${{ env.FIREBASE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,functions \
            --non-interactive

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
