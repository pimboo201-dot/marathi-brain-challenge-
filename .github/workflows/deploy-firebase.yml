name: Deploy Firestore Rules (Spark Plan)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Firebase source
        shell: bash
        run: |
          set -euo pipefail

          FIREBASE_ROOT=""

          if [ -f "firebase.json" ]; then
            FIREBASE_ROOT="$PWD"
          fi

          if [ -z "$FIREBASE_ROOT" ]; then
            SOURCE_ZIP=""
            for f in \
              ./marathi-brain-firebase-source.zip \
              ./firebase-source.zip \
              ./Marathi-Brain-Firebase-Source.zip; do
              if [ -f "$f" ]; then
                SOURCE_ZIP="$f"
                break
              fi
            done

            if [ -n "$SOURCE_ZIP" ]; then
              rm -rf .firebase-source
              mkdir -p .firebase-source
              unzip -q "$SOURCE_ZIP" -d .firebase-source

              CANDIDATE="$(find .firebase-source -type f -name firebase.json -print -quit || true)"

              if [ -n "$CANDIDATE" ]; then
                FIREBASE_ROOT="$(dirname "$CANDIDATE")"
              fi
            fi
          fi

          if [ -z "$FIREBASE_ROOT" ]; then
            echo "ERROR: firebase.json not found"
            exit 1
          fi

          echo "FIREBASE_ROOT=$FIREBASE_ROOT" >> "$GITHUB_ENV"
          echo "Using Firebase root: $FIREBASE_ROOT"

      - name: Validate Firebase files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$FIREBASE_ROOT/firebase.json"
          test -f "$FIREBASE_ROOT/firebase/firestore.rules"

      - name: Create service account file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || {
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          }

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

          PROJECT_ID=$(node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8"));
            process.stdout.write(x.project_id);
          ')

          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Configure Firebase project
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Verify Firebase access
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          firebase projects:list --non-interactive

      - name: Deploy Firestore Rules Only
        working-directory: ${{ env.FIREBASE_ROOT }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules \
            --non-interactive

      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
